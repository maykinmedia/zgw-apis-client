[tox]
envlist = py{312,313,314}
skip_missing_interpreters = true

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
extras = tests
commands =
    pytest {posargs:tests} --cov=zgw_apis_client --cov-report=xml --cov-report=term-missing

[testenv:ruff]
basepython = python
skipsdist = true
extras = tests
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
basepython = python
skipsdist = true
extras = tests
commands =
    pyright

[testenv:docs]
basepython = python
changedir = docs
skipsdist = true
extras = docs
allowlist_externals = make
commands =
    make SPHINXOPTS="-W" html
    make linkcheck
